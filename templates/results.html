<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Plan — EntertainmentAI</title>
  <meta name="description" content="Your personalized entertainment plan — curated by AI agents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --surface2: #161616;
      --surface3: #1c1c1c;
      --gold: #c8a96e;
      --gold-bright: #dbbe85;
      --gold-dim: #8a6f42;
      --gold-glow: rgba(200, 169, 110, 0.12);
      --gold-glow-strong: rgba(200, 169, 110, 0.25);
      --text: #e8e0d0;
      --text-secondary: #b0a898;
      --text-muted: #5a5248;
      --red: #c0392b;
      --border: rgba(200, 169, 110, 0.10);
      --border-hover: rgba(200, 169, 110, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Film grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 999;
    }

    /* Spotlight vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200,169,110,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 120% 80% at 50% 100%, rgba(0,0,0,0.7) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0;
      animation: float-up linear infinite;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0.3;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--border);
      background: transparent;
      font-family: 'DM Mono', monospace;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .back-btn:hover {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(200,169,110,0.04);
    }

    .topbar-query {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .topbar-label {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      white-space: nowrap;
    }

    .topbar-q {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── MAIN LAYOUT ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    /* ── LOADING STATE ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 0;
      gap: 2.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .film-reel {
      display: inline-flex;
      gap: 7px;
    }

    .reel-hole {
      width: 11px;
      height: 11px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .reel-hole:nth-child(2) { animation-delay: 0.15s; }
    .reel-hole:nth-child(3) { animation-delay: 0.30s; }
    .reel-hole:nth-child(4) { animation-delay: 0.45s; }
    .reel-hole:nth-child(5) { animation-delay: 0.60s; }

    .loading-title {
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
    }

    /* Cinematic countdown bar */
    .progress-track {
      width: 200px;
      height: 2px;
      background: var(--surface3);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      transition: width 0.5s ease;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      max-width: 420px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      opacity: 0.4;
      transform: translateX(-8px);
      transition: all 0.4s ease;
    }

    .step.active {
      opacity: 1;
      color: var(--text);
      transform: translateX(0);
    }

    .step.done {
      opacity: 0.5;
      color: var(--gold-dim);
      transform: translateX(0);
    }

    .step-icon {
      font-size: 1rem;
      width: 1.5rem;
      text-align: center;
    }

    /* ── ERROR STATE ── */
    #error {
      display: none;
      background: rgba(192, 57, 43, 0.06);
      border: 1px solid rgba(192, 57, 43, 0.20);
      padding: 1.2rem 1.5rem;
      margin-top: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: #e07060;
      animation: fadeUp 0.4s ease both;
    }

    #error a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 400;
    }

    #error a:hover {
      text-decoration: underline;
    }

    /* ── RESULTS ── */
    #results {
      display: none;
      animation: fadeUp 0.7s ease both;
    }

    .results-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .results-meta {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-family: 'DM Mono', monospace;
      margin-bottom: 0.6rem;
    }

    .results-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text);
      line-height: 1.15;
    }

    .results-title em {
      color: var(--gold);
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .divider-icon {
      font-size: 0.9rem;
      color: var(--gold-dim);
      animation: twinkle 3s ease-in-out infinite;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
      gap: 0;
    }

    .tab-btn {
      padding: 0.85rem 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
      transition: color 0.25s, border-color 0.25s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .tab-btn:hover {
      color: var(--text-secondary);
    }

    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── CONTENT CARDS ── */
    .md-body {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.2rem 2.5rem;
      position: relative;
      line-height: 1.85;
      overflow: hidden;
    }

    .md-body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    /* Plan card — special treatment */
    .plan-body {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    }

    .plan-body::after {
      content: '✦';
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      color: var(--gold-dim);
      font-size: 1.2rem;
      opacity: 0.3;
    }

    /* ── MARKDOWN STYLED ELEMENTS ── */
    .md-body h1, .md-body h2, .md-body h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.3;
      color: var(--text);
      margin: 1.8rem 0 0.7rem;
    }

    .md-body h1 {
      font-size: 1.6rem;
      font-style: italic;
      color: var(--gold);
    }

    .md-body h2 {
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .md-body h3 {
      font-size: 1.1rem;
      color: var(--gold-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .md-body h1:first-child,
    .md-body h2:first-child { margin-top: 0; }

    .md-body p {
      margin: 0.6rem 0;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 300;
    }

    .md-body strong {
      font-weight: 500;
      color: var(--text);
    }

    .md-body em {
      font-style: italic;
      color: var(--text-secondary);
    }

    /* Tables */
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      font-size: 0.92rem;
      overflow-x: auto;
      display: block;
    }

    .md-body thead tr {
      background: rgba(200,169,110,0.10);
    }

    .md-body th {
      padding: 0.7rem 1rem;
      text-align: left;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    .md-body td {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid rgba(200,169,110,0.06);
      color: var(--text);
      vertical-align: top;
      font-weight: 300;
    }

    .md-body tbody tr:hover {
      background: rgba(200,169,110,0.03);
    }

    .md-body tbody tr:last-child td { border-bottom: none; }

    /* Lists */
    .md-body ul, .md-body ol {
      padding-left: 1.5rem;
      margin: 0.6rem 0;
    }

    .md-body li {
      margin: 0.35rem 0;
      font-weight: 300;
      font-size: 1.05rem;
    }

    .md-body ul li::marker { color: var(--gold-dim); }
    .md-body ol li::marker { color: var(--gold); font-weight: 400; }

    /* Blockquote */
    .md-body blockquote {
      border-left: 2px solid var(--gold-dim);
      padding: 0.6rem 1.2rem;
      margin: 1.2rem 0;
      background: rgba(200,169,110,0.03);
      font-style: italic;
      color: var(--text-secondary);
    }

    /* Horizontal rule */
    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.8rem 0;
    }

    /* Code */
    .md-body code {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.1em 0.4em;
      font-size: 0.85em;
      font-family: 'DM Mono', monospace;
      color: var(--gold);
    }

    /* Links */
    .md-body a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,169,110,0.3);
      transition: border-color 0.2s;
    }

    .md-body a:hover {
      border-bottom-color: var(--gold);
    }

    /* ── BOTTOM ACTION ── */
    .bottom-action {
      text-align: center;
      margin-top: 3rem;
    }

    .btn-new {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 1.6rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-new:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
      background: rgba(200,169,110,0.04);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding-top: 3rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%      { opacity: 1;   transform: scale(1.1); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }

    @keyframes float-up {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      90% { opacity: 0.05; }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .page { padding: 2rem 1.25rem 4rem; }
      .md-body { padding: 1.5rem 1.2rem; }
      .topbar { padding: 0.6rem 1rem; }
      .tabs { overflow-x: auto; }
      .tab-btn { white-space: nowrap; padding: 0.7rem 1rem; }
      .results-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Top bar -->
  <div class="topbar">
    <a href="/new" class="back-btn">← New Search</a>
    <div class="topbar-query">
      <span class="topbar-label">Query</span>
      <span class="topbar-q" id="topbar-q">—</span>
    </div>
  </div>

  <div class="page">
    <!-- Loading -->
    <div id="loading">
      <div class="spinner-wrap">
        <div class="film-reel">
          <div class="reel-hole"></div>
          <div class="reel-hole"></div>
          <div class="reel-hole"></div>
          <div class="reel-hole"></div>
          <div class="reel-hole"></div>
        </div>
        <div class="loading-title">Agents at work</div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <div class="steps">
        <div class="step" id="step-movies"><span class="step-icon">🎬</span> Movie Agent — scanning ratings & reviews</div>
        <div class="step" id="step-music"><span class="step-icon">🎵</span> Music Agent — curating a playlist</div>
        <div class="step" id="step-plan"><span class="step-icon">📋</span> Planner — building your evening</div>
      </div>
    </div>

    <!-- Error -->
    <div id="error"></div>

    <!-- Results -->
    <div id="results">
      <div class="results-header">
        <div class="results-meta">Your Entertainment Plan</div>
        <div class="results-title" id="results-title">Plan</div>
      </div>

      <div class="divider">
        <span class="divider-icon">✦</span>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="tabs">
        <button class="tab-btn" id="tab-plan" onclick="showTab('plan')">📋 Full Plan</button>
        <button class="tab-btn" id="tab-movies" onclick="showTab('movies')">🎬 Movies</button>
        <button class="tab-btn" id="tab-music" onclick="showTab('music')">🎵 Music</button>
      </div>

      <div id="panel-plan" class="tab-panel">
        <div class="md-body plan-body" id="content-plan"></div>
      </div>
      <div id="panel-movies" class="tab-panel">
        <div class="md-body" id="content-movies"></div>
      </div>
      <div id="panel-music" class="tab-panel">
        <div class="md-body" id="content-music"></div>
      </div>

      <div class="bottom-action">
        <a href="/new" class="btn-new">↩ Plan Something Else</a>
      </div>

      <footer>
        Built with CrewAI · Groq · Serper
      </footer>
    </div>
  </div>

  <script>
    const PLAN_ID = '{{ plan_id }}';
    let pollInterval = null;
    let stepPhase = 0;
    let progressValue = 0;

    // Configure marked
    marked.setOptions({ breaks: true, gfm: true });

    function renderMd(md) {
      return marked.parse(md || '');
    }

    // Progress bar animation
    function animateProgress() {
      const fill = document.getElementById('progress-fill');
      const interval = setInterval(() => {
        if (progressValue >= 90) {
          clearInterval(interval);
          return;
        }
        progressValue += Math.random() * 3;
        if (progressValue > 90) progressValue = 90;
        fill.style.width = progressValue + '%';
      }, 500);
      return interval;
    }

    let progressInterval = animateProgress();

    // Animate loading steps based on intent
    function animateSteps(intent) {
      const stepsToShow = {
        movies: ['step-movies'],
        music: ['step-music'],
        both: ['step-movies', 'step-music', 'step-plan'],
      }[intent] || ['step-movies', 'step-music', 'step-plan'];

      // Hide irrelevant steps
      ['step-movies', 'step-music', 'step-plan'].forEach(id => {
        const el = document.getElementById(id);
        if (!stepsToShow.includes(id)) el.style.display = 'none';
      });

      // Animate through visible steps
      stepsToShow.forEach((id, i) => {
        setTimeout(() => {
          if (i > 0) {
            document.getElementById(stepsToShow[i - 1])?.classList.replace('active', 'done');
          }
          document.getElementById(id)?.classList.add('active');
        }, i * 3000);
      });
    }

    function showTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      const btn = document.getElementById('tab-' + name);
      const panel = document.getElementById('panel-' + name);
      if (btn) btn.classList.add('active');
      if (panel) panel.classList.add('active');
    }

    function renderResults(data) {
      // Complete the progress bar
      clearInterval(progressInterval);
      const fill = document.getElementById('progress-fill');
      fill.style.width = '100%';

      // Brief pause for the progress bar to complete
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('results').style.display = 'block';

        // Title
        document.getElementById('results-title').innerHTML = `"<em>${data.query}</em>"`;

        const intent = data.intent || 'both';

        // Show/hide tabs
        const tabPlan   = document.getElementById('tab-plan');
        const tabMovies = document.getElementById('tab-movies');
        const tabMusic  = document.getElementById('tab-music');

        tabPlan.style.display   = intent === 'both' ? '' : 'none';
        tabMovies.style.display = (intent === 'movies' || intent === 'both') ? '' : 'none';
        tabMusic.style.display  = (intent === 'music'  || intent === 'both') ? '' : 'none';

        // Fill content
        if (data.plan)   document.getElementById('content-plan').innerHTML   = renderMd(data.plan);
        if (data.movies) document.getElementById('content-movies').innerHTML = renderMd(data.movies);
        if (data.music)  document.getElementById('content-music').innerHTML  = renderMd(data.music);

        // Default tab
        if (intent === 'both')        showTab('plan');
        else if (intent === 'movies') showTab('movies');
        else                          showTab('music');

        // Smooth scroll to results
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 500);
    }

    async function poll() {
      try {
        const res = await fetch(`/api/result/${PLAN_ID}`);
        const data = await res.json();

        if (!res.ok) {
          clearInterval(pollInterval);
          showError(data.error || 'An unexpected error occurred.');
          return;
        }

        document.getElementById('topbar-q').textContent = data.query || '—';

        if (data.status === 'done') {
          clearInterval(pollInterval);
          renderResults(data);
        } else if (data.status === 'error') {
          clearInterval(pollInterval);
          showError(data.error || 'Something went wrong during processing.');
        } else {
          // still processing — animate steps based on intent
          if (stepPhase === 0) {
            animateSteps(data.intent || 'both');
            stepPhase = 1;
          }
        }
      } catch (err) {
        clearInterval(pollInterval);
        showError(err.message);
      }
    }

    function showError(msg) {
      clearInterval(progressInterval);
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.innerHTML = `<strong>⚠ Something went wrong:</strong> ${msg}<br><br><a href="/new">← Try again</a>`;
    }

    // Start polling immediately, then every 2.5s
    poll();
    pollInterval = setInterval(poll, 2500);

    // Floating particles
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (14 + Math.random() * 20) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
